# Keeps the pinned actions, images and dependencies current. Actions are pinned
# by commit so a moved tag can't change what runs; this proposes updates.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directories: ["/", "/modules/*"]
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directories: ["/web", "/apps/wittyreader", "/clients/desktop", "/clients/mobile"]
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
