name: ci
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# Nothing in CI needs to write to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The newest patch release, not the minimum go.mod names: every Go patch
      # fixes security problems in the standard library that binaries ship with.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: cd web && npm ci --ignore-scripts --no-audit --no-fund && npx tsc --noEmit -p . && npm run build
      - name: Theme contrast, design tokens and design rules
        run: python3 scripts/theme-contrast.py && python3 scripts/design-tokens.py --check && python3 scripts/design-check.py
      - run: node --experimental-strip-types --test web/src/ui/spatial.test.mjs web/src/ui/themeMaker.test.mjs web/src/shell/navModel.test.mjs
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # Before the tests: those that stream through a real FFmpeg skip without it,
      # and WittyPlay's run a real game runner through it.
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      # BD-J's tests run disc code in Java. They skip where there is none, and the
      # runner has one: here a skip would hide a hole in the sandbox, so it fails.
      - name: Tests
        env:
          WMS_REQUIRE_JAVA: "1"
        run: |
          java -version
          WMS_TEST_LAN=1 go test ./... -count=1 -json > "$RUNNER_TEMP/go-test.json" || failed=1
          python3 scripts/ci-test-report.py "$RUNNER_TEMP/go-test.json"
          exit ${failed:-0}
      # Transcodes, disc sessions and scans run concurrently; only this finds data races.
      - name: Race detector
        run: CGO_ENABLED=1 go test -race -count=1 -timeout 25m ./internal/...
      - name: Known vulnerabilities (reported, does not stop the build)
        continue-on-error: true
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      # Every manifest is sound, its range valid, and this server is inside it. A new
      # server version that falls outside a range fails here until maxServer is raised.
      - name: Module manifests and version ranges
        run: |
          server="$(go run ./cmd/wittymediaserver version | awk '{print $2}')"
          # The tool wants each manifest in a folder named for its module.
          tmp="$(mktemp -d)"
          for m in $(go list -m -f '{{.Path}}' all | grep '^github.com/wittywilla/' | grep -vE '/(wittymodule|wittymediaserver)$'); do
            cp -r "$(go list -m -f '{{.Dir}}' "$m")" "$tmp/${m##*/}"
          done
          for f in web/module-manifests/*.json; do
            mkdir "$tmp/$(basename "$f" .json)" && cp "$f" "$tmp/$(basename "$f" .json)/module.json"
          done
          chmod -R u+w "$tmp"
          go run github.com/wittywilla/wittymodule/cmd/wittymodule check -server "$server" "$tmp"/*/
      - name: Cross-compile every release platform
        run: |
          for t in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 linux/arm linux/386 freebsd/amd64 freebsd/arm64; do
            echo "== $t"
            GOOS=${t%/*} GOARCH=${t#*/} GOARM=7 CGO_ENABLED=0 go build -o /dev/null ./cmd/wittymediaserver || exit 1
            case $t in darwin/*) ;; *) GOOS=${t%/*} GOARCH=${t#*/} GOARM=7 CGO_ENABLED=0 go build -o /dev/null ./cmd/wittymediaserver-tray || exit 1 ;; esac
            case $t in windows/*|darwin/*) GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/wittymediaserver-uninstall || exit 1 ;; esac
            flags=""; case $t in freebsd/*) flags="github.com/ebitengine/purego/internal/fakecgo=-std" ;; esac
            GOOS=${t%/*} GOARCH=${t#*/} GOARM=7 CGO_ENABLED=0 go build -gcflags="$flags" -o /dev/null github.com/wittywilla/wittyplay/cmd/wittyplay-host || exit 1
          done
      - name: Build-script smoke test (no FFmpeg downloads)
        run: |
          SKIP_WEB=1 SKIP_FFMPEG=1 scripts/build-release.sh ci-test linux/amd64 windows/amd64
          # What a package holds, by name: internal/layout, docs/INSTALL.md.
          test -x dist/wittymediaserver-ci-test-linux-amd64/bin/wittymediaserver
          test -x dist/wittymediaserver-ci-test-linux-amd64/WittyMediaServer
          test -x dist/wittymediaserver-ci-test-linux-amd64/bin/wittyplay-game-runner
          test -f dist/wittymediaserver-ci-test-windows-amd64/bin/wittymediaserver.exe
          test -f dist/wittymediaserver-ci-test-windows-amd64/WittyMediaServer.exe
          test -f "dist/wittymediaserver-ci-test-windows-amd64/Uninstall WittyMediaServer.exe"
          test -f dist/wittymediaserver-ci-test-windows-amd64/bin/wittyplay-game-runner.exe
          SKIP_WEB=1 SKIP_FFMPEG=1 scripts/build-release.sh ci-test freebsd/amd64
          test -x dist/wittymediaserver-ci-test-freebsd-amd64/bin/wittymediaserver
          test -x dist/wittymediaserver-ci-test-freebsd-amd64/WittyMediaServer
          test -f dist/wittymediaserver-ci-test-freebsd-amd64/share/wittymediaserver.rc
          test -x dist/wittymediaserver-ci-test-freebsd-amd64/install.sh
          dist/wittymediaserver-ci-test-linux-amd64/bin/wittymediaserver version
