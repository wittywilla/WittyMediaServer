name: ci
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# Nothing in CI needs to write to the repository.
permissions:
  contents: read

# A newer commit on a pull request replaces that pull request's older runs, queued or running, so
# the build machines aren't kept busy with commits nobody will merge. Every other run (a push to the
# main branch, a schedule, one started by hand) has a group of its own and always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What a pull request adds to the dependencies: known vulnerabilities at a high level or above.
  dependencies:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # Commits from Windows lose the executable bit, and a release can't run what's left. A job of
  # its own, so it answers in seconds rather than after the tests. Run through bash, so a check
  # that lost its own bit still says which files.
  executable-bits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Scripts are executable in git
        run: bash scripts/check-executable.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The newest patch release, not the minimum go.mod names: every Go patch
      # fixes security problems in the standard library that binaries ship with.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: cd web && npm ci --ignore-scripts --no-audit --no-fund && npx tsc --noEmit -p . && npm run build
      - name: Theme contrast, design tokens and design rules
        run: python3 scripts/theme-contrast.py && python3 scripts/design-tokens.py --check && python3 scripts/design-check.py
      - run: node --experimental-strip-types --test web/src/ui/spatial.test.mjs web/src/ui/themeMaker.test.mjs web/src/shell/navModel.test.mjs web/src/safeLink.test.mjs web/src/pages/setup/plan.test.mjs web/src/pages/tv/tvThemes.test.mjs web/src/pages/settings/searchIndex.test.mjs web/src/pages/settings/settingsCss.test.mjs web/src/pages/photos/mapMath.test.mjs web/src/player/sync.test.mjs web/src/player/viewPrefs.test.mjs web/src/brandName.test.mjs
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # Before the tests: those that stream through a real FFmpeg skip without it,
      # and WittyPlay's run a real game runner through it.
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Tests
        run: |
          WMS_TEST_LAN=1 go test ./... -count=1 -timeout 30m -json > "$RUNNER_TEMP/go-test.json" || failed=1
          python3 scripts/ci-test-report.py "$RUNNER_TEMP/go-test.json"
          exit ${failed:-0}
      # Transcodes, disc sessions and scans run concurrently; only this finds data races.
      - name: Race detector
        run: CGO_ENABLED=1 go test -race -count=1 -timeout 45m ./internal/...
      # Fails only on a vulnerability this code can reach. A release goes out with none.
      - name: Known vulnerabilities in Go code
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./internal/... ./cmd/...
      - name: Known vulnerabilities in web packages
        run: cd web && npm audit --audit-level=high
      - name: Downloaded modules are what go.sum says
        run: go mod verify
      - name: Static analysis (reported, does not stop the build)
        continue-on-error: true
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./internal/... ./cmd/...
      # The server has no module's code in it: each is a program of its own, fetched and verified
      # at run time. What they share is WittyModule and the core libraries: shared code with no
      # program of its own, pinned by go.mod. docs/plans/module-isolation.md.
      - name: Nothing but WittyModule and core libraries from the modules
        run: |
          found="$(for goos in linux windows darwin freebsd; do GOOS=$goos go list -deps -f '{{with .Module}}{{.Path}}{{end}}' ./... ; done | sort -u | grep '^github.com/wittywilla/' | grep -vE '/(wittymodule|wittydisc|wittymediaserver)$' || true)"
          [ -z "$found" ] || { echo "$found"; exit 1; }
      - name: Cross-compile every release platform
        run: |
          for t in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 linux/arm linux/386 freebsd/amd64 freebsd/arm64; do
            echo "== $t"
            GOOS=${t%/*} GOARCH=${t#*/} GOARM=7 CGO_ENABLED=0 go build -o /dev/null ./cmd/wittymediaserver || exit 1
            case $t in darwin/*) ;; *) GOOS=${t%/*} GOARCH=${t#*/} GOARM=7 CGO_ENABLED=0 go build -o /dev/null ./cmd/wittymediaserver-tray || exit 1 ;; esac
            case $t in windows/*|darwin/*) GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/wittymediaserver-uninstall || exit 1 ;; esac
          done
      - name: Build-script smoke test (no FFmpeg downloads)
        run: |
          SKIP_WEB=1 SKIP_FFMPEG=1 scripts/build-release.sh ci-test linux/amd64 windows/amd64
          # What a package holds, by name: internal/layout, docs/INSTALL.md.
          test -x dist/wittymediaserver-ci-test-linux-amd64/bin/wittymediaserver
          test -x dist/wittymediaserver-ci-test-linux-amd64/WittyMediaServer
          test -f dist/wittymediaserver-ci-test-windows-amd64/bin/wittymediaserver.exe
          test -f dist/wittymediaserver-ci-test-windows-amd64/WittyMediaServer.exe
          test -f "dist/wittymediaserver-ci-test-windows-amd64/Uninstall WittyMediaServer.exe"
          SKIP_WEB=1 SKIP_FFMPEG=1 scripts/build-release.sh ci-test freebsd/amd64
          test -x dist/wittymediaserver-ci-test-freebsd-amd64/bin/wittymediaserver
          test -x dist/wittymediaserver-ci-test-freebsd-amd64/WittyMediaServer
          test -f dist/wittymediaserver-ci-test-freebsd-amd64/share/wittymediaserver.rc
          test -x dist/wittymediaserver-ci-test-freebsd-amd64/install.sh
          dist/wittymediaserver-ci-test-linux-amd64/bin/wittymediaserver version
          # A package holds no module unless a starter set was asked for.
          test ! -e dist/wittymediaserver-ci-test-linux-amd64/modules

  # The container image: built and run as docs/DOCKER.md says, locked down, then built for
  # the other architectures the release publishes, so a broken one shows before a tag does.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build for amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: wittymediaserver:ci
          build-args: VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run it
        run: scripts/test/docker-smoke.sh wittymediaserver:ci
      - name: Build for arm64 and armv7
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/arm64,linux/arm/v7
          build-args: VERSION=ci
          cache-from: type=gha

  # The same checks on a Mac: Apple silicon (macos-latest) and Intel (macos-15-intel). The tests
  # run on Apple silicon only; both build the app and the .pkg, install it, see the service answer,
  # and uninstall it. Nothing here is signed. docs/MACOS.md says what this can't show.
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, arch: arm64, tests: true }
          - { runner: macos-15-intel, arch: amd64, tests: false }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: cd web && npm ci --ignore-scripts --no-audit --no-fund && npx tsc --noEmit -p . && npm run build
      - run: go vet ./...
      - name: Install FFmpeg
        if: matrix.tests
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install ffmpeg && ffmpeg -hide_banner -encoders | grep -i videotoolbox
      - name: Tests
        if: matrix.tests
        run: |
          WMS_TEST_LAN=1 go test ./... -count=1 -timeout 45m -json > "$RUNNER_TEMP/go-test.json" || failed=1
          python3 scripts/ci-test-report.py "$RUNNER_TEMP/go-test.json"
          exit ${failed:-0}
      - name: Build the app, with its FFmpeg
        run: |
          SKIP_WEB=1 scripts/build-release.sh 0.0.0-ci darwin/${{ matrix.arch }}
          app="dist/wittymediaserver-0.0.0-ci-darwin-${{ matrix.arch }}/WittyMediaServer.app/Contents"
          test -x "$app/MacOS/WittyMediaServer"
          test -x "$app/Helpers/wittymediaserver"
          test -f "$app/Resources/icon.png"
          test -x "dist/wittymediaserver-0.0.0-ci-darwin-${{ matrix.arch }}/Uninstall WittyMediaServer.app/Contents/MacOS/Uninstall WittyMediaServer"
          file "$app/MacOS/WittyMediaServer" "$app/Helpers/wittymediaserver" "$app/Helpers/ffmpeg"
          "$app/Helpers/wittymediaserver" version
          "$app/Helpers/ffmpeg" -hide_banner -encoders | grep -i videotoolbox
      - name: Make the .pkg
        run: |
          packaging/macos/build-pkg.sh 0.0.0-ci "dist/wittymediaserver-0.0.0-ci-darwin-${{ matrix.arch }}" ${{ matrix.arch }} installers
          pkgutil --payload-files "installers/wittymediaserver-0.0.0-ci-macos-${{ matrix.arch }}.pkg" | grep -q 'Helpers/wittymediaserver$'
      # What the installer and launchd do on a clean Mac, which only a Mac shows.
      - name: Install it, the service answers, uninstall it
        run: |
          sudo installer -pkg "installers/wittymediaserver-0.0.0-ci-macos-${{ matrix.arch }}.pkg" -target /
          test -L /usr/local/bin/wittymediaserver
          sudo launchctl print system/com.wittywilla.wittymediaserver | head -20
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:9797/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:9797/api/health
          sudo /usr/local/bin/wittymediaserver --uninstall --remove-data --yes
          test ! -e /Applications/WittyMediaServer.app
          test ! -e /Library/LaunchDaemons/com.wittywilla.wittymediaserver.plist
          ! curl -fsS --max-time 2 http://127.0.0.1:9797/api/health
      - name: The service's log, when something failed
        if: failure()
        run: |
          sudo launchctl print system/com.wittywilla.wittymediaserver || true
          # The package's own scripts: what they said before the installer gave up.
          sudo grep -E 'postinstall|preinstall|install\.sh' /var/log/install.log | tail -60 || true
          sudo log show --last 10m --predicate 'process == "wittymediaserver"' --style compact | tail -100 || true
          ls -la ~/Library/Application\ Support/WittyMediaServer 2>/dev/null || true
          find ~/Library/Application\ Support/WittyMediaServer -name '*.log' -exec tail -50 {} \; 2>/dev/null || true

  # What the server does with real modules: each is built from its own repository at its main
  # branch, into a catalogue with a throwaway key that only a test build trusts.
  with-modules:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: cd web && npm ci --ignore-scripts --no-audit --no-fund && npm run build
      - name: A catalogue from every module's own repository
        run: |
          mkdir "$RUNNER_TEMP/repos"
          for r in WittyModule WittyPhotos WittyIntegratedFileBrowser WittyDVD WittyBluray WittyCD WittyTuner WittyPlay WittyCouch WittyCouchHost WittyRigs WittyInk WittyEbook WittyPDF WittyComics WittyVisualizer WittyStats; do
            git clone -q --depth 1 "https://github.com/wittywilla/$r" "$RUNNER_TEMP/repos/$r"
          done
          scripts/make-test-catalog.sh "$RUNNER_TEMP/catalog" "$RUNNER_TEMP/repos"
      - name: Tests, with them
        env:
          WMS_TEST_CATALOG: ${{ runner.temp }}/catalog
        run: go test ./... -count=1 -timeout 30m
