name: ci
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# Nothing in CI needs to write to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The newest patch release, not the minimum go.mod names: every Go patch
      # fixes security problems in the standard library that binaries ship with.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: cd web && npm ci --ignore-scripts --no-audit --no-fund && npx tsc --noEmit -p . && npm run build
      - run: node --experimental-strip-types --test modules/wittyplay/web/logic.test.mjs
      - name: Theme contrast and design tokens
        run: python3 scripts/theme-contrast.py && python3 scripts/design-tokens.py --check
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # Before the tests: those that stream through a real FFmpeg skip without it,
      # and WittyPlay's run a real game runner through it.
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Tests
        run: |
          WMS_TEST_LAN=1 go test ./... -count=1 -json > "$RUNNER_TEMP/go-test.json" || failed=1
          python3 scripts/ci-test-report.py "$RUNNER_TEMP/go-test.json"
          exit ${failed:-0}
      # Transcodes, disc sessions and scans run concurrently; only this finds data races.
      - name: Race detector
        run: CGO_ENABLED=1 go test -race -count=1 ./internal/...
      - name: Known vulnerabilities (reported, does not stop the build)
        continue-on-error: true
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      # go.work builds the modules against each other's local source.
      - name: Modules (their own go.mod)
        run: |
          (cd modules/wittymodule && go vet ./... && go test ./... -count=1)
          (cd modules/wittyphotos && go vet ./... && go test ./... -count=1 && CGO_ENABLED=0 go build -o /dev/null ./cmd/wittyphotos-module)
          (cd modules/wittydisc && go vet ./... && go test ./... -count=1)
          (cd modules/wittydvd && go vet ./... && go test ./... -count=1 && CGO_ENABLED=0 go build -o /dev/null ./cmd/wittydvd)
          (cd modules/wittybluray && go vet ./... && go test ./... -count=1 && CGO_ENABLED=0 go build -o /dev/null ./cmd/wittybluray)
          (cd modules/wittyintegratedfilebrowser && go vet ./... && go test ./... -count=1)
          (cd modules/wittytuner && go vet ./... && go test ./... -count=1)
          (cd modules/wittyplay && go vet ./... && go test ./... -count=1 && CGO_ENABLED=0 go build -o /dev/null ./cmd/wittyplay-host)
      # Every manifest is sound, its range valid, and this server is inside it. A new
      # server version that falls outside a range fails here until maxServer is raised.
      - name: Module manifests and version ranges
        run: |
          server="$(go run ./cmd/wms version | awk '{print $2}')"
          go run ./modules/wittymodule/cmd/wittymodule check -server "$server" $(ls -d modules/*/ web/src/modules/*/ | grep -v wittymodule)
      # What `go install …@version` sees: released dependencies only. Fails while an engine relies
      # on WittyDisc changes that are not released yet, which only matters for the next release.
      - name: Modules build on their own (GOWORK=off)
        continue-on-error: true
        run: |
          for m in wittydisc wittydvd wittybluray wittyintegratedfilebrowser wittytuner wittyplay; do (cd modules/$m && GOWORK=off go build ./...) || exit 1; done
      - name: Cross-compile every release platform
        run: |
          for t in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 linux/arm linux/386 freebsd/amd64 freebsd/arm64; do
            echo "== $t"
            GOOS=${t%/*} GOARCH=${t#*/} GOARM=7 CGO_ENABLED=0 go build -o /dev/null ./cmd/wms || exit 1
            case $t in darwin/*) ;; *) GOOS=${t%/*} GOARCH=${t#*/} GOARM=7 CGO_ENABLED=0 go build -o /dev/null ./cmd/wms-tray || exit 1 ;; esac
            flags=""; case $t in freebsd/*) flags="github.com/ebitengine/purego/internal/fakecgo=-std" ;; esac
            (cd modules/wittyplay && GOOS=${t%/*} GOARCH=${t#*/} GOARM=7 CGO_ENABLED=0 go build -gcflags="$flags" -o /dev/null ./cmd/wittyplay-host) || exit 1
            (cd modules/wittyphotos && GOOS=${t%/*} GOARCH=${t#*/} GOARM=7 CGO_ENABLED=0 go build -o /dev/null ./cmd/wittyphotos-module) || exit 1
          done
      - name: Build-script smoke test (no FFmpeg downloads)
        run: SKIP_WEB=1 SKIP_FFMPEG=1 scripts/build-release.sh ci-test linux/amd64 windows/amd64
