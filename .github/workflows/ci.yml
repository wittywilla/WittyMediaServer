name: ci
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# Nothing in CI needs to write to the repository.
permissions:
  contents: read

# A newer commit on a pull request replaces that pull request's older runs, queued or running, so
# the build machines aren't kept busy with commits nobody will merge. Every other run (a push to the
# main branch, a schedule, one started by hand) has a group of its own and always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The jobs run side by side, each well under half an hour (#395). Go's build and module caches are
# kept per job, and only from a push to the main branch: a pull request reads them and never writes
# its own, so pull requests can't push the main branch's caches out of the repository's 10 GB.
#
# Every platform's programs and the container image are built by build.yml, on every pull request
# too; this workflow tests.

jobs:
  # What a pull request adds to the dependencies: known vulnerabilities at a high level or above.
  dependencies:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

  # Commits from Windows lose the executable bit, and a release can't run what's left. A job of
  # its own, so it answers in seconds rather than after the tests. Run through bash, so a check
  # that lost its own bit still says which files.
  executable-bits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Scripts are executable in git
        run: bash scripts/check-executable.sh

  # The web client: types, build, its unit tests, its rules and its packages. No Go.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci --ignore-scripts --no-audit --no-fund && npx tsc --noEmit -p . && npm run build
      - name: Theme contrast, design tokens and design rules
        run: python3 scripts/theme-contrast.py && python3 scripts/design-tokens.py --check && python3 scripts/design-check.py
      - run: node --experimental-strip-types --test web/src/ui/spatial.test.mjs web/src/pages/setup/address.test.mjs web/src/ui/gamepad.test.mjs web/src/ui/inputModel.test.mjs web/src/ui/zonesModel.test.mjs web/src/ui/density.test.mjs web/src/tvmode/nav.test.mjs web/src/ui/themeMaker.test.mjs web/src/ui/menuPlace.test.mjs web/src/shell/navModel.test.mjs web/src/safeLink.test.mjs web/src/pages/setup/plan.test.mjs web/src/pages/tv/tvThemes.test.mjs web/src/pages/tv/backgroundPlay.test.mjs web/src/pages/tv/guideLogic.test.mjs web/src/pages/settings/searchIndex.test.mjs web/src/pages/settings/settingsCss.test.mjs web/src/player/sync.test.mjs web/src/player/viewPrefs.test.mjs web/src/player/remoteKeys.test.mjs web/src/brandName.test.mjs web/src/ui/backEntry.test.mjs web/src/ui/qr.test.mjs web/src/themeOverrides.test.mjs web/src/player/markers.test.mjs web/src/player/trackOrder.test.mjs web/src/wittyinfo/model.test.mjs web/src/sdui/model.test.mjs web/src/sdui/logic.test.mjs web/src/sdui/markdown.test.mjs web/src/pages/settings/pages/editorModel.test.mjs web/src/audio/stemMix.test.mjs web/src/audio/voiceFx.test.mjs web/src/audio/fxChain.test.mjs web/src/themeColours.test.mjs web/src/profileWords.test.mjs web/src/canvas/rules.test.mjs web/src/components/watchOffers.test.mjs web/src/components/pairing.test.mjs web/src/remote/partyLogic.test.mjs web/src/remote/playerStates.test.mjs web/src/remote/position.test.mjs web/src/remote/queue.test.mjs web/src/remote/capabilities.test.mjs web/src/pages/settings/store/overrides.test.mjs web/src/pages/settings/store/changeNotes.test.mjs web/src/pages/settings/librarySwitches.test.mjs web/src/spec/model.test.mjs web/src/spec/specs/filters.test.mjs web/src/spec/specs/specs.test.mjs web/src/spec/specs/groupC.test.mjs web/src/spec/specs/collections.test.mjs web/src/spec/specs/diagnoser.test.mjs web/src/spec/specs/tdarr.test.mjs web/src/spec/specs/logs.test.mjs web/src/spec/specs/installFile.test.mjs web/src/spec/specs/security.test.mjs web/src/spec/specs/profiles.test.mjs web/src/spec/specs/screentime.test.mjs web/src/spec/specs/remoteAccess.test.mjs web/src/spec/specs/peerToPeer.test.mjs web/src/spec/specs/accounts.test.mjs web/src/spec/specs/b2.test.mjs web/src/spec/specs/c1.test.mjs web/src/spec/specs/media.test.mjs web/src/spec/specs/updates.test.mjs web/src/spec/specs/transcode.test.mjs web/src/spec/specs/repair.test.mjs web/src/spec/specs/backup.test.mjs web/src/spec/specs/modules.test.mjs web/src/spec/specs/legal.test.mjs web/src/spec/specs/radio.test.mjs web/src/spec/specs/creators.test.mjs web/src/spec/specs/albums.test.mjs web/src/player/errors.test.mjs web/src/brandStyle.test.mjs web/src/pages/layoutModel.test.mjs web/src/pages/setup/network.test.mjs web/src/spec/specs/moduleDetail.test.mjs web/src/spec/specs/store.test.mjs web/src/spec/specs/libtranscode.test.mjs web/src/spec/specs/r2.test.mjs web/src/spec/specs/r3.test.mjs web/src/ui/layoutSpecs.test.mjs web/src/sdui/playModel.test.mjs web/src/sdui/regions.test.mjs web/src/sdui/routes.layer.test.mjs web/src/sdui/forms.test.mjs web/src/sdui/render/titles.test.mjs web/src/sdui/refresh.test.mjs web/src/heroScrim.test.mjs web/src/i18n/i18n.test.mjs web/src/tvmode/levels.test.mjs web/src/pages/settings/menu/model.test.mjs web/src/runtime.test.mjs web/src/moduleLoad.test.mjs
      - name: Controller presses on a simulated machine
        run: cd web && npm run test:pads
      - name: Module screens are drawn once, inside their card Provider
        run: cd web && npm run test:cards
      - name: A sign-in stays out of media addresses
        run: cd web && npm run test:links
      - name: Every button has a name a screen reader can say
        run: cd web && npm run test:names
      # The runner's Chrome, headless, on the build above and a stand-in for the API: no Go, no data folder.
      - name: Standalone pages are one centred card with the server's name, and don't scroll
        run: cd web && WV_BROWSER=$(command -v google-chrome) npm run test:standalone
      - name: Every source file has its licence header
        run: python3 scripts/license-headers.py
      - name: Known vulnerabilities in web packages
        run: cd web && npm audit --audit-level=high

  # Go's checks that run no tests: formatting, vet, vulnerabilities, what the modules may bring in,
  # and the list of modules the server is built with.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The newest patch release, not the minimum go.mod names: every Go patch
      # fixes security problems in the standard library that binaries ship with.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: false
      - name: Restore the Go caches
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # The race detector runs in the race job, in shares on machines of their own. This
      # checks that the shares hold every package and test exactly once.
      - name: Race shares hold every test
        run: go run ./scripts/testshard -shards 4 -split ./internal/server,./internal/brandart -check -- ./internal/...
      # Fails on every vulnerability this code can reach, except the few scripts/vulncheck
      # accepts by name and module, each with its reason, and only while no fix exists.
      - name: Known vulnerabilities in Go code
        run: |
          set -o pipefail
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -format json ./internal/... ./cmd/... | go run ./scripts/vulncheck
      - name: Downloaded modules are what go.sum says
        run: go mod verify
      - name: Static analysis (reported, does not stop the build)
        continue-on-error: true
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./internal/... ./cmd/...
      # The server has no module's code in it: each is a program of its own, fetched and verified
      # at run time. What they share is WittyModule and the core libraries: shared code with no
      # program of its own, pinned by go.mod. docs/plans/module-isolation.md.
      - name: Nothing but WittyModule and core libraries from the modules
        run: |
          found="$(for goos in linux windows darwin freebsd; do GOOS=$goos go list -deps -f '{{with .Module}}{{.Path}}{{end}}' ./... ; done | sort -u | grep '^github.com/wittywilla/' | grep -vE '/(wittymodule|wittydisc|wittymediaserver)$' || true)"
          [ -z "$found" ] || { echo "$found"; exit 1; }
      # A server shows the modules it was built with until it has read a catalogue; an old copy
      # once had every icon wrong (#384). Versions may differ, nothing else (#396).
      - name: The built-in list of modules is the published catalogue's
        run: go run ./scripts/knowncheck
      - name: Keep the Go caches
        if: github.event_name != 'pull_request' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # Every Go test, without the race detector (the race job has that).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: false
      - name: Restore the Go caches
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The server embeds web/dist, and some tests read what it serves.
      - run: cd web && npm ci --ignore-scripts --no-audit --no-fund && npm run build
      # Before the tests: those that stream through a real FFmpeg skip without it,
      # and WittyPlay's run a real game runner through it. man-db re-indexes after
      # every package, which made this step take minutes; nothing here reads a manual.
      - name: Install FFmpeg
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get -o Acquire::Retries=3 update -qq && sudo apt-get -o Acquire::Retries=3 install -y -qq ffmpeg
      - name: Tests
        run: |
          WMS_TEST_LAN=1 go test ./... -count=1 -timeout 25m -json > "$RUNNER_TEMP/go-test.json" || failed=1
          python3 scripts/ci-test-report.py "$RUNNER_TEMP/go-test.json"
          exit ${failed:-0}
      - name: Keep the Go caches
        if: github.event_name != 'pull_request' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # What scripts/build-release.sh puts in a package, for Linux, Windows and FreeBSD, without
  # downloading FFmpeg. build.yml builds every platform's programs; this checks the folders.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: false
      - name: Restore the Go caches
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - name: Build-script smoke test (no FFmpeg downloads)
        run: |
          SKIP_WEB=1 SKIP_FFMPEG=1 scripts/build-release.sh ci-test linux/amd64 windows/amd64
          # What a package holds, by name: internal/layout, docs/INSTALL.md.
          test -x dist/wittymediaserver-ci-test-linux-amd64/bin/wittymediaserver
          test -x dist/wittymediaserver-ci-test-linux-amd64/WittyMediaServer
          test -f dist/wittymediaserver-ci-test-windows-amd64/bin/wittymediaserver.exe
          test -f dist/wittymediaserver-ci-test-windows-amd64/WittyMediaServer.exe
          test -f "dist/wittymediaserver-ci-test-windows-amd64/Uninstall WittyMediaServer.exe"
          SKIP_WEB=1 SKIP_FFMPEG=1 scripts/build-release.sh ci-test freebsd/amd64
          test -x dist/wittymediaserver-ci-test-freebsd-amd64/bin/wittymediaserver
          test -x dist/wittymediaserver-ci-test-freebsd-amd64/WittyMediaServer
          test -f dist/wittymediaserver-ci-test-freebsd-amd64/share/wittymediaserver.rc
          test -x dist/wittymediaserver-ci-test-freebsd-amd64/install.sh
          dist/wittymediaserver-ci-test-linux-amd64/bin/wittymediaserver version
          # A package holds no module unless a starter set was asked for.
          test ! -e dist/wittymediaserver-ci-test-linux-amd64/modules
      - name: Keep the Go caches
        if: github.event_name != 'pull_request' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # Transcodes, disc sessions and scans run concurrently; only this finds data races. Every
  # test under ./internal/..., shared out over four machines by scripts/testshard: the whole set
  # took nearly an hour on one, internal/server alone 46 minutes (#395). internal/server and
  # internal/brandart are shared out test by test, the others go whole.
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: race (${{ matrix.shard }} of 4)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: false
      # The four shares build the same packages, so they share one cache, kept by the first.
      - name: Restore the Go caches
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      # Tests that stream through a real FFmpeg skip without it.
      - name: Install FFmpeg
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get -o Acquire::Retries=3 update -qq && sudo apt-get -o Acquire::Retries=3 install -y -qq ffmpeg
      - name: Race detector
        run: CGO_ENABLED=1 go run ./scripts/testshard -shards 4 -shard ${{ matrix.shard }} -split ./internal/server,./internal/brandart -- -race -count=1 -timeout 40m ./internal/...
      - name: Keep the Go caches
        if: matrix.shard == 1 && github.event_name != 'pull_request' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # The same checks on a Mac: Apple silicon (macos-latest) and Intel (macos-15-intel). The tests
  # run on Apple silicon only; both build the app and the .pkg, install it, see the service answer,
  # and uninstall it. Nothing here is signed. docs/MACOS.md says what this can't show.
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, arch: arm64, tests: true }
          - { runner: macos-15-intel, arch: amd64, tests: false }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: false
      - name: Restore the Go caches
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci --ignore-scripts --no-audit --no-fund && npx tsc --noEmit -p . && npm run build
      - run: go vet ./...
      - name: Install FFmpeg
        if: matrix.tests
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install ffmpeg && ffmpeg -hide_banner -encoders | grep -i videotoolbox
      - name: Tests
        if: matrix.tests
        run: |
          WMS_TEST_LAN=1 go test ./... -count=1 -timeout 35m -json > "$RUNNER_TEMP/go-test.json" || failed=1
          python3 scripts/ci-test-report.py "$RUNNER_TEMP/go-test.json"
          exit ${failed:-0}
      - name: Build the app, with its FFmpeg
        run: |
          SKIP_WEB=1 scripts/build-release.sh 0.0.0-ci darwin/${{ matrix.arch }}
          app="dist/wittymediaserver-0.0.0-ci-darwin-${{ matrix.arch }}/WittyMediaServer.app/Contents"
          test -x "$app/MacOS/WittyMediaServer"
          test -x "$app/Helpers/wittymediaserver"
          test -f "$app/Resources/icon.png"
          test -x "dist/wittymediaserver-0.0.0-ci-darwin-${{ matrix.arch }}/Uninstall WittyMediaServer.app/Contents/MacOS/Uninstall WittyMediaServer"
          file "$app/MacOS/WittyMediaServer" "$app/Helpers/wittymediaserver" "$app/Helpers/ffmpeg"
          "$app/Helpers/wittymediaserver" version
          "$app/Helpers/ffmpeg" -hide_banner -encoders | grep -i videotoolbox
      - name: Make the .pkg
        run: |
          packaging/macos/build-pkg.sh 0.0.0-ci "dist/wittymediaserver-0.0.0-ci-darwin-${{ matrix.arch }}" ${{ matrix.arch }} installers
          pkgutil --payload-files "installers/wittymediaserver-0.0.0-ci-macos-${{ matrix.arch }}.pkg" | grep -q 'Helpers/wittymediaserver$'
      # What the installer and launchd do on a clean Mac, which only a Mac shows.
      - name: Install it, the service answers, uninstall it
        run: |
          sudo installer -pkg "installers/wittymediaserver-0.0.0-ci-macos-${{ matrix.arch }}.pkg" -target /
          test -L /usr/local/bin/wittymediaserver
          sudo launchctl print system/com.wittywilla.wittymediaserver | head -20
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:9797/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:9797/api/health
          sudo /usr/local/bin/wittymediaserver --uninstall --remove-data --yes
          test ! -e /Applications/WittyMediaServer.app
          test ! -e /Library/LaunchDaemons/com.wittywilla.wittymediaserver.plist
          ! curl -fsS --max-time 2 http://127.0.0.1:9797/api/health
      - name: The service's log, when something failed
        if: failure()
        run: |
          sudo launchctl print system/com.wittywilla.wittymediaserver || true
          # The package's own scripts: what they said before the installer gave up.
          sudo grep -E 'postinstall|preinstall|install\.sh' /var/log/install.log | tail -60 || true
          sudo log show --last 10m --predicate 'process == "wittymediaserver"' --style compact | tail -100 || true
          ls -la ~/Library/Application\ Support/WittyMediaServer 2>/dev/null || true
          find ~/Library/Application\ Support/WittyMediaServer -name '*.log' -exec tail -50 {} \; 2>/dev/null || true
      - name: Keep the Go caches
        if: github.event_name != 'pull_request' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # What the server does with real modules: each is built from its own repository into a catalogue
  # with a throwaway key that only a test build trusts. On a pull request each module comes from the
  # branch the pull request goes into (v0.8.3-alpha, say) where it has one, and from its main branch
  # otherwise. Only the packages whose tests use real modules run here; the test job runs the rest,
  # where these skip. Here none may skip, so a test that needs modules can't pass by skipping.
  with-modules:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: false
      - name: Restore the Go caches
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install FFmpeg
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get -o Acquire::Retries=3 update -qq && sudo apt-get -o Acquire::Retries=3 install -y -qq ffmpeg
      - run: cd web && npm ci --ignore-scripts --no-audit --no-fund && npm run build
      - name: A catalogue from every module's own repository
        env:
          BASE: ${{ github.base_ref }}
        run: |
          mkdir "$RUNNER_TEMP/repos"
          for r in WittyModule WittyPhotos WittyIntegratedFileBrowser WittyDVD WittyBluray WittyCD WittyTuner WittyPlay WittyCouch WittyCouchHost WittyRigs WittyInk WittyEbook WittyPDF WittyComics WittyVisualizer WittyStats; do
            url="https://github.com/wittywilla/$r"
            if [ -n "$BASE" ] && git ls-remote --exit-code --heads "$url" "$BASE" >/dev/null; then
              echo "$r: $BASE"; git clone -q --depth 1 --branch "$BASE" "$url" "$RUNNER_TEMP/repos/$r"
            else
              echo "$r: its main branch"; git clone -q --depth 1 "$url" "$RUNNER_TEMP/repos/$r"
            fi
          done
          scripts/make-test-catalog.sh "$RUNNER_TEMP/catalog" "$RUNNER_TEMP/repos"
      - name: Tests, with them
        env:
          WMS_TEST_CATALOG: ${{ runner.temp }}/catalog
        run: |
          pkgs="$(go list -test -f '{{.ImportPath}} {{join .Deps " "}}' ./... | awk '/ github.com\/wittywilla\/wittymediaserver\/internal\/modules\/modtest( |$)/ {print $1}' | sed -E 's/\.test$//' | sort -u)"
          [ -n "$pkgs" ] || { echo "no package's tests use real modules: the search for them is wrong"; exit 1; }
          echo "$pkgs"
          go test $pkgs -count=1 -timeout 25m -json > "$RUNNER_TEMP/go-test.json" || failed=1
          python3 scripts/ci-test-report.py "$RUNNER_TEMP/go-test.json" --no-skip "this needs real modules" || failed=1
          exit ${failed:-0}
      - name: Keep the Go caches
        if: github.event_name != 'pull_request' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
