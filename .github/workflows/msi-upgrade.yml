# Installs an MSI built from this branch, then a newer one over it, the way someone updating
# would: for everyone, just for one account, and as a service. 0.6.1-alpha's MSI failed exactly
# this with error 2613, and nothing tested an upgrade before it was published. A service on a
# port of its own has to keep it through the upgrade.
name: msi-upgrade

on:
  pull_request:
    paths:
      - packaging/windows/**
      - .github/workflows/msi-upgrade.yml
      # What the installer runs to carry the port over.
      - internal/config/settings.go
      - cmd/wittymediaserver/config_cmd.go
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on a pull request replaces that pull request's older runs, queued or running, so
# the build machines aren't kept busy with commits nobody will merge. Every other run (a push to the
# main branch, a schedule, one started by hand) has a group of its own and always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  upgrade:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.x"
      # Two MSIs from this branch, an older and a newer version of the same programs. Published
      # releases come and go (0.8.0-alpha starts with none), so the test doesn't depend on them.
      - name: This branch's programs, packaged as 0.0.1 and 0.0.2
        shell: bash
        env:
          SKIP_WEB: "1"
          SKIP_FFMPEG: "1"
        run: |
          # The installer runs the server to carry a port over, so it has to be this branch's. The
          # web app doesn't matter for that: a page stands in for it.
          mkdir -p web/dist
          [ -f web/dist/index.html ] || echo '<!doctype html>' > web/dist/index.html
          scripts/build-release.sh 0.0.2-alpha windows/amd64
      - name: Build the two MSIs
        shell: pwsh
        run: |
          dotnet tool install --tool-path "$env:RUNNER_TEMP\wix" wix --version 6.0.2
          $env:WIX_EXE = "$env:RUNNER_TEMP\wix\wix.exe"
          & $env:WIX_EXE extension add -g WixToolset.UI.wixext/6.0.2 WixToolset.Firewall.wixext/6.0.2 WixToolset.Util.wixext/6.0.2
          packaging\windows\build-msi.ps1 -Version 0.0.1-alpha -PackageDir dist\wittymediaserver-0.0.2-alpha-windows-amd64 -Arch amd64 -OutDir old
          packaging\windows\build-msi.ps1 -Version 0.0.2-alpha -PackageDir dist\wittymediaserver-0.0.2-alpha-windows-amd64 -Arch amd64 -OutDir new
      - name: Upgrade for everyone, with the server running
        shell: pwsh
        run: packaging\windows\test-upgrade.ps1 -OldMsi old\wittymediaserver-0.0.1-alpha-windows-amd64.msi -NewMsi new\wittymediaserver-0.0.2-alpha-windows-amd64.msi -Scope machine -LogDir logs\machine
      - name: Upgrade just for this account, with the server running
        shell: pwsh
        run: packaging\windows\test-upgrade.ps1 -OldMsi old\wittymediaserver-0.0.1-alpha-windows-amd64.msi -NewMsi new\wittymediaserver-0.0.2-alpha-windows-amd64.msi -Scope user -LogDir logs\user
      - name: Upgrade with the background service
        shell: pwsh
        run: packaging\windows\test-upgrade.ps1 -OldMsi old\wittymediaserver-0.0.1-alpha-windows-amd64.msi -NewMsi new\wittymediaserver-0.0.2-alpha-windows-amd64.msi -Scope machine -Service -LogDir logs\service
      - name: Upgrade a service on a port of its own, which carries over
        shell: pwsh
        run: packaging\windows\test-upgrade.ps1 -OldMsi old\wittymediaserver-0.0.1-alpha-windows-amd64.msi -NewMsi new\wittymediaserver-0.0.2-alpha-windows-amd64.msi -Scope machine -Service -Port 8181 -LogDir logs\service-port
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: msi-upgrade-logs
          path: logs
