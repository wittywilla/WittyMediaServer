name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Every job asks for only what it needs: code from a dependency can run during
# a build, and must not find a token that can publish, or the signing key.
permissions: {}

jobs:
  # FreeBSD has no prebuilt static FFmpeg; build one in a FreeBSD VM so the
  # FreeBSD archive is as self-contained as the others. If this job fails the
  # release still ships (FreeBSD then uses ffmpeg from `pkg install ffmpeg`).
  ffmpeg-freebsd:
    permissions:
      contents: read
    uses: ./.github/workflows/ffmpeg-freebsd.yml

  # The macOS app needs CGO (Cocoa), so build it natively for both
  # architectures and hand it to the packaging job.
  tray-macos:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: false
      - name: Build the app (arm64 + amd64)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"; [ "$GITHUB_REF_TYPE" = tag ] || VERSION="dev-${GITHUB_SHA::8}"
          mkdir -p tray/arm64 tray/amd64
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o tray/arm64/WittyMediaServer ./cmd/wittymediaserver-tray
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o tray/amd64/WittyMediaServer ./cmd/wittymediaserver-tray
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tray-darwin
          path: tray

  archives:
    needs: [ffmpeg-freebsd, tray-macos]
    # Package even when the FreeBSD FFmpeg build failed; only the macOS tray is required.
    if: ${{ !cancelled() && needs.tray-macos.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          name: ffmpeg-freebsd-amd64
          path: .tools/ffmpeg-freebsd/amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tray-darwin
          path: .tools/tray-darwin
      - name: Build release archives (all platforms)
        env:
          FFMPEG_FREEBSD_DIR: ${{ github.workspace }}/.tools/ffmpeg-freebsd
          TRAY_DARWIN_DIR: ${{ github.workspace }}/.tools/tray-darwin
          SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }} # empty until there is one
          SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"; [ "$GITHUB_REF_TYPE" = tag ] || VERSION="dev-${GITHUB_SHA::8}"
          scripts/build-release.sh "$VERSION"
      - name: Build the .deb and .rpm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"; [ "$GITHUB_REF_TYPE" = tag ] || VERSION="dev-${GITHUB_SHA::8}"
          GOBIN="$RUNNER_TEMP/bin" GOWORK=off go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3
          export NFPM="$RUNNER_TEMP/bin/nfpm"
          for a in amd64 arm64 armv7 386; do
            packaging/linux/build-packages.sh "$VERSION" "dist/wittymediaserver-$VERSION-linux-$a" "$a" dist
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: archives
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm

  # The installers that need their own system's tools, from the same files.
  installers-windows:
    needs: archives
    if: ${{ !cancelled() && needs.archives.result == 'success' }}
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: archives
          path: dist
      - name: Build the .msi files
        shell: pwsh
        run: |
          dotnet tool install --tool-path "$env:RUNNER_TEMP\wix" wix --version 6.0.2
          $env:WIX_EXE = "$env:RUNNER_TEMP\wix\wix.exe"
          & $env:WIX_EXE extension add -g WixToolset.UI.wixext/6.0.2 WixToolset.Firewall.wixext/6.0.2 WixToolset.Util.wixext/6.0.2
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($env:GITHUB_REF_TYPE -ne 'tag') { $version = "dev-$($env:GITHUB_SHA.Substring(0,8))" }
          foreach ($arch in 'amd64', 'arm64') {
            Expand-Archive "dist\wittymediaserver-$version-windows-$arch.zip" stage
            packaging\windows\build-msi.ps1 -Version $version -PackageDir "stage\wittymediaserver-$version-windows-$arch" -Arch $arch -OutDir installers
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installers-windows
          path: installers/*.msi
          if-no-files-found: error

  installers-macos:
    needs: archives
    if: ${{ !cancelled() && needs.archives.result == 'success' }}
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: archives
          path: dist
      - name: Build the .pkg files
        run: |
          VERSION="${GITHUB_REF_NAME#v}"; [ "$GITHUB_REF_TYPE" = tag ] || VERSION="dev-${GITHUB_SHA::8}"
          mkdir stage
          for a in arm64 amd64; do
            tar -xzf "dist/wittymediaserver-$VERSION-darwin-$a.tar.gz" -C stage
            packaging/macos/build-pkg.sh "$VERSION" "stage/wittymediaserver-$VERSION-darwin-$a" "$a" installers
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installers-macos
          path: installers/*.pkg
          if-no-files-found: error

  installers-freebsd:
    needs: archives
    if: ${{ !cancelled() && needs.archives.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: archives
          path: dist
      - name: Build the .pkg files
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SHA: ${{ github.sha }}
        with:
          release: "14.4"
          usesh: true
          envs: REF_NAME REF_TYPE SHA
          run: |
            VERSION="${REF_NAME#v}"; [ "$REF_TYPE" = tag ] || VERSION="dev-$(printf %.8s "$SHA")"
            mkdir -p stage installers
            for a in amd64 arm64; do
              tar -xzf "dist/wittymediaserver-$VERSION-freebsd-$a.tar.gz" -C stage
              sh packaging/freebsd/build-pkg.sh "$VERSION" "stage/wittymediaserver-$VERSION-freebsd-$a" "$a" installers
            done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installers-freebsd
          path: installers/*.pkg
          if-no-files-found: error

  # One checksum list for everything people can download.
  checksums:
    needs: [archives, installers-windows, installers-macos, installers-freebsd]
    if: ${{ !cancelled() && needs.archives.result == 'success' && needs.installers-windows.result == 'success' && needs.installers-macos.result == 'success' && needs.installers-freebsd.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: all
          merge-multiple: true
      - name: Write the checksum list
        run: |
          VERSION="${GITHUB_REF_NAME#v}"; [ "$GITHUB_REF_TYPE" = tag ] || VERSION="dev-${GITHUB_SHA::8}"
          mkdir sums
          (cd all && sha256sum -- *) > "sums/wittymediaserver-$VERSION-SHA256SUMS.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sums
          path: sums/*SHA256SUMS.txt

  # The signing key is used here, on a clean machine that builds nothing but the
  # signing tool and sees only the checksum list. npm packages and build scripts
  # run in the job above, which never has the key.
  sign:
    needs: checksums
    if: ${{ !cancelled() && needs.checksums.result == 'success' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    # Add required reviewers to this environment (see docs/PUBLISHING.md) to
    # approve each signature by hand.
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sums
          path: signed
      - name: Sign the checksum list
        env:
          # The release signing key (a secret, see docs/PUBLISHING.md). Without
          # it the release is unsigned and installs can't update to it from
          # Settings until a .sig is added by hand.
          SIGNING_KEY: ${{ secrets.WMS_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then echo "::warning::no signing key: this release is unsigned"; exit 0; fi
          key="$RUNNER_TEMP/release.key"
          (umask 077; printf '%s\n' "$SIGNING_KEY" > "$key")
          go run ./scripts/sign sign -key "$key" signed/*SHA256SUMS.txt
          rm -f "$key"
          go run ./scripts/sign verify signed/*SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signature
          path: signed/*.sig
          if-no-files-found: warn

  # Publishing runs no project code at all.
  publish:
    needs: [checksums, sign]
    if: ${{ !cancelled() && needs.checksums.result == 'success' && needs.sign.result == 'success' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: archives
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: installers-windows
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: installers-macos
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: installers-freebsd
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sums
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          name: signature
          path: dist
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.msi
            dist/*.pkg
            dist/*.deb
            dist/*.rpm
            dist/*SHA256SUMS.txt
            dist/*SHA256SUMS.txt.sig
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

  # Only for a tag, and only once its release is out.
  docker:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # pushes the image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/wittymediaserver
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
            type=raw,value=alpha,enable=${{ startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-') }}
            type=sha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
