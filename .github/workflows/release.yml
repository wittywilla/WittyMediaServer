name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # FreeBSD has no prebuilt static FFmpeg; build one in a FreeBSD VM so the
  # FreeBSD archive is as self-contained as the others. If this job fails the
  # release still ships (FreeBSD then uses ffmpeg from `pkg install ffmpeg`).
  ffmpeg-freebsd:
    uses: ./.github/workflows/ffmpeg-freebsd.yml

  # The macOS tray launcher needs CGO (Cocoa), so build it natively for both
  # architectures and hand it to the packaging job.
  tray-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build tray launcher (arm64 + amd64)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"; [ "$GITHUB_REF_TYPE" = tag ] || VERSION="dev-${GITHUB_SHA::8}"
          mkdir -p tray/arm64 tray/amd64
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o tray/arm64/WittyMediaServer ./cmd/wms-tray
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o tray/amd64/WittyMediaServer ./cmd/wms-tray
      - uses: actions/upload-artifact@v7
        with:
          name: tray-darwin
          path: tray

  archives:
    needs: [ffmpeg-freebsd, tray-macos]
    # Package even when the FreeBSD FFmpeg build failed; only the macOS tray is required.
    if: ${{ !cancelled() && needs.tray-macos.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ffmpeg-freebsd-amd64
          path: .tools/ffmpeg-freebsd/amd64
      - uses: actions/download-artifact@v8
        with:
          name: tray-darwin
          path: .tools/tray-darwin
      - name: Build release archives (all platforms)
        env:
          FFMPEG_FREEBSD_DIR: ${{ github.workspace }}/.tools/ffmpeg-freebsd
          TRAY_DARWIN_DIR: ${{ github.workspace }}/.tools/tray-darwin
          # The release signing key (repository secret, see docs/PUBLISHING.md).
          # Without it the release is unsigned and installs can't update to it
          # from Settings until a .sig is added by hand.
          SIGNING_KEY: ${{ secrets.WMS_SIGNING_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"; [ "$GITHUB_REF_TYPE" = tag ] || VERSION="dev-${GITHUB_SHA::8}"
          if [ -n "$SIGNING_KEY" ]; then
            export WMS_SIGNING_KEY="$RUNNER_TEMP/release.key"
            (umask 077; printf '%s\n' "$SIGNING_KEY" > "$WMS_SIGNING_KEY")
          else
            export WMS_SIGNING_KEY="$RUNNER_TEMP/none"
          fi
          scripts/build-release.sh "$VERSION"
          rm -f "$RUNNER_TEMP/release.key"
      - uses: actions/upload-artifact@v7
        with:
          name: archives
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*-setup.exe
            dist/*SHA256SUMS.txt
            dist/*SHA256SUMS.txt.sig
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*-setup.exe
            dist/*SHA256SUMS.txt
            dist/*SHA256SUMS.txt.sig
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/wittymediaserver
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
