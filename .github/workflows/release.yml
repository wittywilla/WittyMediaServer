name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # FreeBSD has no prebuilt static FFmpeg; build one in a FreeBSD VM so the
  # FreeBSD archive is as self-contained as the others.
  ffmpeg-freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          usesh: true
          prepare: pkg install -y gmake nasm pkgconf curl git autoconf automake libtool
          run: |
            sh scripts/build-ffmpeg-static.sh /tmp/ffmpeg-freebsd
            mkdir -p ffmpeg-freebsd && cp /tmp/ffmpeg-freebsd/ffmpeg /tmp/ffmpeg-freebsd/ffprobe ffmpeg-freebsd/
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-freebsd-amd64
          path: ffmpeg-freebsd

  archives:
    needs: ffmpeg-freebsd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-freebsd-amd64
          path: .tools/ffmpeg-freebsd
      - name: Build release archives
        env:
          FFMPEG_FREEBSD_DIR: ${{ github.workspace }}/.tools/ffmpeg-freebsd
        run: |
          chmod +x .tools/ffmpeg-freebsd/* || true
          VERSION="${GITHUB_REF_NAME#v}"; [ "$GITHUB_REF_TYPE" = tag ] || VERSION="dev-${GITHUB_SHA::8}"
          scripts/build-release.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: archives
          path: |
            dist/*.zip
            dist/*.tar.gz
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
          generate_release_notes: true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/wittymediaserver
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
