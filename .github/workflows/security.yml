name: security
# Looks for newly published vulnerabilities in what this project is built with,
# also when nothing in the project changed.
on:
  schedule:
    - cron: "17 5 * * 1"
  pull_request:
    paths:
      - go.mod
      - go.sum
      - go.work
      - "**/go.mod"
      - web/package-lock.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: web placeholder (the server embeds web/dist)
        run: mkdir -p web/dist && touch web/dist/.gitkeep
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: npm audit
        run: cd web && npm audit --omit=dev
