name: security
# Looks for newly published vulnerabilities in what this project is built with,
# also when nothing in the project changed.
on:
  schedule:
    - cron: "17 5 * * 1"
  pull_request:
    paths:
      - go.mod
      - go.sum
      - "**/go.mod"
      - web/package-lock.json
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on a pull request replaces that pull request's older runs, queued or running, so
# the build machines aren't kept busy with commits nobody will merge. Every other run (a push to the
# main branch, a schedule, one started by hand) has a group of its own and always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: web placeholder (the server embeds web/dist)
        run: mkdir -p web/dist && touch web/dist/.gitkeep
      # As in ci.yml: scripts/vulncheck says what it accepts, and why.
      - name: govulncheck
        run: |
          set -o pipefail
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -format json ./internal/... ./cmd/... | go run ./scripts/vulncheck
      - name: npm audit
        run: cd web && npm audit --audit-level=high
      - name: Downloaded modules are what go.sum says
        run: go mod verify
      # Not a failure: a nudge. Dependabot proposes these too.
      - name: What has a newer version
        run: |
          go list -m -u -f '{{if and .Update (not .Indirect)}}{{.Path}} {{.Version}} -> {{.Update.Version}}{{end}}' all | sed '/^$/d' || true
          (cd web && npm outdated) || true
