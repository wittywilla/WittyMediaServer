name: smoke
# End-to-end smoke tests: a real server built from this change, used the way people use it. What
# each covers, and how to run them on your own machine: scripts/smoke/README.md. The client apps'
# repository runs its own (Android phone and TV, the desktop app) against this branch's server.
on:
  pull_request:
    branches: ['v0.*']
  push:
    branches: ['v0.*']
  # By hand, to show what the tests make of an older module (empty: as for a pull request).
  workflow_dispatch:
    inputs:
      wittyplay_ref:
        description: WittyPlay tag or commit for the catalogue

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Modules come from their release branch of the same name as this one (v0.8.3-alpha), else main.
  SMOKE_MODULE_REF: ${{ github.base_ref || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Build the server, Wittyconnect, WittyRelay and a catalogue with WittyPlay and WittyTuner
        env:
          SMOKE_REF_WITTYPLAY: ${{ inputs.wittyplay_ref }}
        run: bash scripts/smoke/build.sh "$RUNNER_TEMP/smoke-build"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: smoke-build
          path: |
            ${{ runner.temp }}/smoke-build/bin
            ${{ runner.temp }}/smoke-build/catalog
          retention-days: 3

  web:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: smoke-build
          path: ${{ runner.temp }}/smoke-build
      # The static FFmpeg scripts/ffmpeg.lock names, kept between runs: no waiting on Ubuntu's mirrors.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/smoke-ffmpeg
          key: smoke-ffmpeg-${{ hashFiles('scripts/ffmpeg.lock') }}
      - name: FFmpeg
        timeout-minutes: 8
        run: bash scripts/smoke/ffmpeg.sh "$RUNNER_TEMP/smoke-ffmpeg"
      # The Game Boy core, downloaded once a week rather than on every run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/smoke-cache
          key: smoke-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: smoke-cache-${{ runner.os }}-
      - name: Tiny media
        run: bash scripts/smoke/media.sh "$RUNNER_TEMP/smoke-media"
      - name: Start and set up the server
        env:
          SMOKE_OUT: ${{ runner.temp }}/smoke-out
          SMOKE_CORES: ${{ runner.temp }}/smoke-cache/cores
        run: chmod +x "$RUNNER_TEMP"/smoke-build/bin/* && bash scripts/smoke/server.sh "$RUNNER_TEMP/smoke-build" "$RUNNER_TEMP/smoke-media"
      - name: The web app, in a browser
        env:
          SMOKE_OUT: ${{ runner.temp }}/smoke-out
          WV_BROWSER: /usr/bin/google-chrome
        run: |
          set -a; . "$SMOKE_OUT/server.env"; set +a
          code=0
          node scripts/smoke/web.mjs "$SMOKE_OUT" || code=1
          node scripts/smoke/game-stream.mjs "$SMOKE_OUT" || code=1
          # Connect a device: its code and QR code, More options, a code really signing a device in (web/scripts/test-connect.mjs).
          WMS_SERVER="$WMS_URL" WMS_USER="$WMS_NAME" WMS_PASSWORD="$WMS_PASS" node web/scripts/test-connect.mjs "$SMOKE_OUT/connect" 2>&1 | tee "$SMOKE_OUT/30-connect-a-device.log"
          [ "${PIPESTATUS[0]}" = 0 ] || { code=1; echo "::error title=Smoke: Connect a device::see 30-connect-a-device.log and connect/*.png"; }
          # Layout: nothing under the top bar, Settings pages read from one edge, no title said twice (web/scripts/test-layout.mjs).
          WMS_SERVER="$WMS_URL" WMS_USER="$WMS_NAME" WMS_PASSWORD="$WMS_PASS" node web/scripts/test-layout.mjs "$SMOKE_OUT/layout" 2>&1 | tee "$SMOKE_OUT/31-layout.log"
          [ "${PIPESTATUS[0]}" = 0 ] || { code=1; echo "::error title=Smoke: Layout::see 31-layout.log, layout/layout-findings.json and layout/*.png"; }
          # Page layout outside Settings: nothing under the top bar (on load, sticky parts, jumps to a section, under the
          # floating glass bar too), no sideways scroll, one alignment per page, no heading twice, focus rings, and TV
          # targets of 48 or more (web/scripts/test-layout-pages.mjs).
          WMS_SERVER="$WMS_URL" WMS_USER="$WMS_NAME" WMS_PASSWORD="$WMS_PASS" LAYOUT_SIZES=wide,desktop,phone,tv LAYOUT_NAV=floatingGlassBar node web/scripts/test-layout-pages.mjs "$SMOKE_OUT/layout-pages" 2>&1 | tee "$SMOKE_OUT/32-layout-pages.log"
          [ "${PIPESTATUS[0]}" = 0 ] || { code=1; echo "::error title=Smoke: Page layout::see 32-layout-pages.log, layout-pages/layout-pages-findings.json and layout-pages/*.png"; }
          # The same pages as the phone app shows them in its web view (data-app), upright and on its side, with Live TV's
          # full-screen player: nothing under the app's bars, 48 targets, nothing over the channel's banner (#765).
          WMS_SERVER="$WMS_URL" WMS_USER="$WMS_NAME" WMS_PASSWORD="$WMS_PASS" LAYOUT_APP=1 LAYOUT_SIZES=phone,phoneland LAYOUT_ROUTES=/tv,/ node web/scripts/test-layout-pages.mjs "$SMOKE_OUT/layout-pages-app" 2>&1 | tee "$SMOKE_OUT/33-layout-pages-app.log"
          [ "${PIPESTATUS[0]}" = 0 ] || { code=1; echo "::error title=Smoke: Page layout in the phone app::see 33-layout-pages-app.log and layout-pages-app/*.png"; }
          exit $code
      - name: Stop the server
        if: always()
        env:
          SMOKE_OUT: ${{ runner.temp }}/smoke-out
        run: bash scripts/smoke/stop.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: smoke-web
          path: |
            ${{ runner.temp }}/smoke-out/*.log
            ${{ runner.temp }}/smoke-out/*.png
            ${{ runner.temp }}/smoke-out/connect
            ${{ runner.temp }}/smoke-out/layout
            ${{ runner.temp }}/smoke-out/layout-pages
            ${{ runner.temp }}/smoke-out/layout-pages-app
            ${{ runner.temp }}/smoke-out/*.txt
            ${{ runner.temp }}/smoke-out/data/logs
          retention-days: 14

  # Ten minutes of a live channel on a small NAS (2 CPUs, 2 GB) behind a 5 Mbit/s, 50 ms upload, in the web app:
  # no jumps of its clock and no freezes (0.8.6 froze for a second every few seconds there).
  livewatch:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: smoke-build
          path: ${{ runner.temp }}/smoke-build
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/smoke-ffmpeg
          key: smoke-ffmpeg-${{ hashFiles('scripts/ffmpeg.lock') }}
      - name: FFmpeg
        timeout-minutes: 8
        run: bash scripts/smoke/ffmpeg.sh "$RUNNER_TEMP/smoke-ffmpeg"
      - name: Ten minutes of live TV at 5 Mbit/s
        env:
          SMOKE_OUT: ${{ runner.temp }}/smoke-out
          WV_BROWSER: /usr/bin/google-chrome
        run: |
          chmod +x "$RUNNER_TEMP"/smoke-build/bin/*
          sudo env "PATH=$PATH" "SMOKE_OUT=$SMOKE_OUT" "WV_BROWSER=$WV_BROWSER" bash scripts/smoke/livewatch.sh "$RUNNER_TEMP/smoke-build" 600
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: smoke-livewatch
          path: |
            ${{ runner.temp }}/smoke-out/*.log
            ${{ runner.temp }}/smoke-out/*.txt
            ${{ runner.temp }}/smoke-out/livewatch
            ${{ runner.temp }}/smoke-out/lw-data/logs
          retention-days: 14

  remote:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: smoke-build
          path: ${{ runner.temp }}/smoke-build
      # The static FFmpeg scripts/ffmpeg.lock names, kept between runs: no waiting on Ubuntu's mirrors.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/smoke-ffmpeg
          key: smoke-ffmpeg-${{ hashFiles('scripts/ffmpeg.lock') }}
      - name: FFmpeg
        timeout-minutes: 8
        run: bash scripts/smoke/ffmpeg.sh "$RUNNER_TEMP/smoke-ffmpeg"
      - name: Two networks, a WittyRelay between them, and an invite link
        env:
          SMOKE_OUT: ${{ runner.temp }}/smoke-out
        run: |
          chmod +x "$RUNNER_TEMP"/smoke-build/bin/*
          go build -o "$RUNNER_TEMP/smoke-build/bin/p2p-netsim" ./scripts/p2p-netsim
          sudo env "PATH=$PATH" "SMOKE_OUT=$SMOKE_OUT" bash scripts/smoke/remote.sh "$RUNNER_TEMP/smoke-build"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: smoke-remote
          path: |
            ${{ runner.temp }}/smoke-out/*.log
            ${{ runner.temp }}/smoke-out/*.txt
            ${{ runner.temp }}/smoke-out/connect.*
            ${{ runner.temp }}/smoke-out/c-*
            ${{ runner.temp }}/smoke-out/data/logs
          retention-days: 14
