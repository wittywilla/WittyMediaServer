# Generated by module-kit (scripts/module-kit.sh in WittyMediaServer). Run it again rather than editing this.
#
# A version tag publishes a release. Tags with a suffix such as -beta are prereleases.
name: release
on:
  push:
    tags: ["v*"]

# Every job asks for only what it needs: code from a dependency can run during a
# build, and must not find a token that can publish, or the signing key.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: The tag must match the version
        run: |
          want="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json | head -1)"
          [ "v$want" = "$GITHUB_REF_NAME" ] || { echo "package.json says $want, and the tag is $GITHUB_REF_NAME"; exit 1; }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test --if-present
      - run: npm run build
      - name: Pack the built app
        run: |
          mkdir release
          name="wittyreader-${GITHUB_REF_NAME#v}"
          (cd dist && zip -qr "../release/$name.zip" .)
          (cd release && sha256sum "$name.zip" > "$name-SHA256SUMS.txt")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-files
          path: release/*
          if-no-files-found: error

  # Publishing runs no project code at all.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-files
          path: release
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: release/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
