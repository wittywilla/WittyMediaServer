<!doctype html><html><head><meta charset="utf-8"><title>Connect to WittyMediaServer</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>body{margin:0;height:100vh;display:grid;place-items:center;background:#0f1115;color:#e8eaf0;font-family:system-ui}
.card{background:#171a21;padding:30px;border-radius:16px;width:360px;max-width:calc(100vw - 32px);box-sizing:border-box;box-shadow:0 20px 50px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.06)}h1{margin:0 0 6px;font-size:22px}
p{color:#a9afbd;margin:0 0 18px}input{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:8px;border:1px solid #2a2f3a;background:#1f232c;color:#fff;font-size:15px;outline:none}
.hint{font-size:13px;margin:10px 0 0}input:focus{border-color:#8b6cff}.err{color:#ff5c6c;font-size:13px;margin:8px 0 0;min-height:1em}
button{margin-top:12px;width:100%;padding:11px;border:0;border-radius:8px;background:#8b6cff;color:#fff;font-weight:600;font-size:15px;cursor:pointer}button:hover{background:#6a4df0}</style></head>
<body><form class="card" id="f">
<h1>Witty<span style="color:#8b6cff">Media</span></h1><p>Enter your server address.</p>
<input id="url" placeholder="https://media.example.com" value="http://localhost:9797" autofocus aria-label="Server address">
<p class="hint">At home, the address from the server's settings, such as http://192.168.1.10:9797. Away from home, the one from Settings &rarr; Remote Access.</p>
<div class="err" id="err" role="alert"></div>
<button>Connect</button></form>
<script>
// "192.168.1.10:9797" means http://192.168.1.10:9797; a name on its own is an
// address on the internet, so https. Plain http is fine at home or in a VPN,
// and nowhere else: passwords could be read on the way.
const privateHost = (h) => /^(localhost|127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.|\[)/i.test(h) || !h.includes('.')
let warned = ''
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault()
  const err = document.getElementById('err')
  let v = document.getElementById('url').value.trim()
  if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(v)) v = (/^[\d.]+(:\d+)?$|^\[|^localhost\b|:\d+$/i.test(v) ? 'http://' : 'https://') + v
  try {
    const u = new URL(v)
    if (u.protocol === 'http:' && !privateHost(u.hostname) && warned !== v) {
      warned = v
      err.textContent = 'This address is not encrypted, so your password could be read on the way. Press Connect again only if you are sure.'
      return
    }
  } catch { /* the app says so below */ }
  const ok = await wittyDesktop.connect(v)
  err.textContent = ok ? '' : 'That is not a web address (http:// or https://).'
})
</script></body></html>
