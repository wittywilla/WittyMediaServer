<!doctype html><html><head><meta charset="utf-8"><title>Connect to WittyMediaServer</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>body{margin:0;height:100vh;display:grid;place-items:center;background:#0f1115;color:#e8eaf0;font-family:system-ui}
.card{background:#171a21;padding:30px;border-radius:16px;width:360px;max-width:calc(100vw - 32px);box-sizing:border-box;box-shadow:0 20px 50px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.06)}h1{margin:0 0 6px;font-size:22px}
p{color:#a9afbd;margin:0 0 18px}input{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:8px;border:1px solid #2a2f3a;background:#1f232c;color:#fff;font-size:15px;outline:none}
input:focus{border-color:#8b6cff}.err{color:#ff5c6c;font-size:13px;margin:8px 0 0;min-height:1em}
button{margin-top:12px;width:100%;padding:11px;border:0;border-radius:8px;background:#8b6cff;color:#fff;font-weight:600;font-size:15px;cursor:pointer}button:hover{background:#6a4df0}</style></head>
<body><form class="card" id="f">
<h1>Witty<span style="color:#8b6cff">Media</span></h1><p>Enter your server address.</p>
<input id="url" placeholder="http://192.168.1.10:9797" value="http://localhost:9797" autofocus aria-label="Server address">
<div class="err" id="err" role="alert"></div>
<button>Connect</button></form>
<script>
// "192.168.1.10:9797" means http://192.168.1.10:9797.
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault()
  let v = document.getElementById('url').value.trim()
  if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(v)) v = 'http://' + v
  const ok = await wittyDesktop.connect(v)
  document.getElementById('err').textContent = ok ? '' : 'That is not a web address (http:// or https://).'
})
</script></body></html>
