apiVersion: apps/v1
kind: Deployment
metadata:
  name: wms
  namespace: wittymedia
  labels: { app: wms }
spec:
  replicas: 1
  strategy: { type: Recreate }   # single SQLite writer + transcode cache
  selector:
    matchLabels: { app: wms }
  template:
    metadata:
      labels: { app: wms }
    spec:
      # Nothing here talks to the Kubernetes API, and a helper could read this token.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: wms
          image: ghcr.io/wittywilla/wittymediaserver:alpha # :latest once there is a full release; docs/DOCKER.md lists the tags
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9797
          envFrom:
            - configMapRef: { name: wms-env }
          env:
            - name: WMS_TRANSCODE_DIR
              value: /transcode
            - name: XDG_CACHE_HOME
              value: /config/cache/xdg
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: transcode, mountPath: /transcode }
            - { name: tmp, mountPath: /tmp }
            - { name: media, mountPath: /media, readOnly: true }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: "500m", memory: "256Mi" }
            limits: { cpu: "4", memory: "2Gi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          # For Intel/AMD VAAPI add:
          # resources.limits: { gpu.intel.com/i915: 1 }
          # and, if the device plugin doesn't open the render node to everyone, the render
          # group's number (ls -ln /dev/dri on the node) under spec.securityContext:
          # supplementalGroups: [105]
          # For NVIDIA: resources.limits: { nvidia.com/gpu: 1 }
          # Check with: kubectl exec -n wittymedia deploy/wms -- wittymediaserver hardware
      volumes:
        - name: config
          persistentVolumeClaim: { claimName: wms-config }
        - name: transcode
          emptyDir: { medium: Memory, sizeLimit: 2Gi }
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
        - name: media
          # Replace with your NFS / hostPath / CSI volume holding movies and DVD images.
          nfs:
            server: nas.local
            path: /volume1/media
            readOnly: true
