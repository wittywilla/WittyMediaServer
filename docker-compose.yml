services:
  wms:
    image: ghcr.io/wittywilla/wittymediaserver:alpha # the newest alpha; :latest is the newest full release
    build: .
    container_name: wittymediaserver
    restart: unless-stopped
    # Nothing it needs writes outside /config and /tmp. Helpers run from /config, so don't mount it noexec.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "9797:9797"
      # - "9443:9443"                # only if you use Settings → Remote Access with HTTPS
    environment:
      - WMS_LOG=info
      - XDG_CACHE_HOME=/config/cache/xdg
      # - WMS_MAX_TRANSCODES=4
      # Behind your own reverse proxy (see docs/REMOTE.md):
      # - WMS_PUBLIC_URL=https://media.example.com
      # - WMS_TRUSTED_PROXIES=172.18.0.2
    volumes:
      - wms-config:/config
      # Mount your media read-only wherever you like; add them as library folders in the UI.
      - /path/to/movies:/media/movies:ro
      - /path/to/dvds:/media/dvds:ro
    # Optional hardware transcoding:
    # devices:
    #   - /dev/dri:/dev/dri          # Intel/AMD VAAPI
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
volumes:
  wms-config:
