<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Retro on every platform</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&display=swap">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div style="width:4100px;height:820px;box-sizing:border-box;padding:36px 40px;background:#1a1a2e;font-family:'IBM Plex Mono',monospace;color:#ffffff">
  <div style="display:flex;align-items:baseline;gap:24px"><div style="font-size:44px;font-weight:700;letter-spacing:-1px">12 · Retro</div><div style="font-size:22px;color:#00ffff">Teletext and CRT: block type, colour keys, eight colours. Server name: a different static colour on each letter of "Witty".</div></div>
  <div style="display:flex;gap:40px;align-items:flex-start;margin-top:24px">
    <div><div style="zoom:.6"><dc-import name="Exp" exp="retro" plat="tv" hint-size="1920px,1080px"></dc-import></div><div style="font-size:18px;margin-top:8px">Apple TV · Android TV · web TV mode</div></div>
    <div><div style="zoom:.6"><dc-import name="Exp" exp="retro" plat="desktop" hint-size="1440px,900px"></dc-import></div><div style="font-size:18px;margin-top:8px">Mac · Windows · Linux · web</div></div>
    <div><div style="zoom:.6"><dc-import name="Exp" exp="retro" plat="tablet" hint-size="1024px,768px"></dc-import></div><div style="font-size:18px;margin-top:8px">iPad · Android tablet</div></div>
    <div><div style="zoom:.6"><dc-import name="Exp" exp="retro" plat="phone" hint-size="390px,844px"></dc-import></div><div style="font-size:18px;margin-top:8px">iPhone · Android</div></div>
    <div><div style="zoom:.6"><dc-import name="Exp" exp="retro" plat="vr" hint-size="1600px,900px"></dc-import></div><div style="font-size:18px;margin-top:8px">Apple Vision Pro · Quest</div></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":4100,"height":820}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
