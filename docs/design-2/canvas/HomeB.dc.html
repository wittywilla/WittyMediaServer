<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rail Home on a TV</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
.root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#120e0a;color:#f3ebe0;font-family:Inter,system-ui,sans-serif}
.rail{position:absolute;left:0;top:0;bottom:0;width:120px;background:#1b150f;display:flex;flex-direction:column;align-items:center;padding:40px 0;box-sizing:border-box;gap:16px}
.ri{width:72px;height:72px;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#c2b4a0}
.ri.on{background:#d98a1c;color:#1a1208}
.ri svg{width:36px;height:36px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pc{flex:none;width:250px;position:relative}
.art{position:relative;width:250px;height:375px;border-radius:14px;overflow:hidden}
.plate{position:absolute;left:0;right:0;bottom:0;padding:44px 16px 14px;background:linear-gradient(0deg,rgba(18,14,10,.92),rgba(18,14,10,0));font-size:25px;font-weight:600;line-height:1.2}
</style>
</helmet>
<div class="root">
  <div class="rail">
    <div style="width:72px;height:72px;border-radius:18px;background:#261d14;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;color:#f0b44a;margin-bottom:24px">W</div>
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
      <div class="ri {{n.cls}}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="{{n.d}}"></path></svg></div>
    </sc-for>
    <div style="flex:1"></div>
    <div style="width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#d98a1c,#8a2f5e)"></div>
  </div>

  <div style="position:absolute;left:200px;top:56px;right:90px;display:flex;align-items:baseline;gap:24px">
    <div style="font-size:57px;font-weight:800;letter-spacing:-1.2px">Home</div>
    <div style="font-size:25px;color:#c2b4a0">Good evening, Willow · on <b style="color:#f3ebe0;font-weight:700">Witty</b><b style="color:#f0b44a;font-weight:700">Media</b></div>
  </div>

  <div style="position:absolute;left:200px;top:160px;width:1630px;height:340px;border-radius:22px;overflow:hidden;background:linear-gradient(120deg,#5b2234,#a85a1c 55%,#e0a030)">
    <div style="position:absolute;right:-60px;top:-80px;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#ffe3a8,#e0a030 40%,transparent 70%);opacity:.8"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(18,14,10,.92),rgba(18,14,10,.55) 50%,rgba(18,14,10,0))"></div>
    <div style="position:absolute;left:56px;top:44px;width:900px">
      <div style="font-size:25px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#f0b44a">New this week</div>
      <div style="font-size:57px;font-weight:800;letter-spacing:-1.2px;line-height:1.08;margin-top:10px">Amber Season</div>
      <div style="font-size:25px;color:#e6d9c6;margin-top:12px">2025 · 8 episodes · Drama</div>
      <div style="display:flex;gap:20px;margin-top:30px">
        <div style="height:64px;padding:0 34px;border-radius:14px;background:#d98a1c;color:#1a1208;font-size:29px;font-weight:700;display:flex;align-items:center;box-shadow:0 0 0 4px #120e0a,0 0 0 8px #f3ebe0">Play S1 E1</div>
        <div style="height:64px;padding:0 34px;border-radius:14px;background:rgba(243,235,224,.14);font-size:29px;font-weight:600;display:flex;align-items:center">Details</div>
      </div>
    </div>
  </div>

  <div style="position:absolute;left:200px;top:540px;right:0">
    <div style="font-size:38px;font-weight:700;letter-spacing:-.4px;margin-bottom:34px">Recently added</div>
    <div style="display:flex;gap:28px">
      <sc-for list="{{posters}}" as="p" hint-placeholder-count="6">
        <div class="pc" style="{{p.lift}}">
          <div class="art" style="background:{{p.bg}};{{p.glow}}">
            <div class="plate" style="{{p.plate}}">{{p.t}}</div>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const nav = [
      { cls: 'on', d: 'M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10' },
      { cls: '', d: 'M4 4h4v16H4zM10 4h4v16h-4zM16 6l4 1-3 13-4-1z' },
      { cls: '', d: 'M6 9h12a4 4 0 014 4v2a3 3 0 01-5 2l-1-2H8l-1 2a3 3 0 01-5-2v-2a4 4 0 014-4zM8 12v3M6.5 13.5h3' },
      { cls: '', d: 'M3 6h18v12H3zM8 21h8M12 18v3' },
      { cls: '', d: 'M11 4a7 7 0 100 14 7 7 0 000-14zM21 21l-5-5' }
    ];
    const art = [
      ['Salt Road', 'linear-gradient(160deg,#2f6f4f,#12202a)'],
      ['Night Market', 'linear-gradient(160deg,#8a2f5e,#1f1b3a)'],
      ['The Glasshouse', 'linear-gradient(160deg,#1c5d7a,#0f1d2a)'],
      ['Ember & Ash', 'linear-gradient(160deg,#a85a1c,#2a1208)'],
      ['Long Division', 'linear-gradient(160deg,#4a5f8a,#171a21)'],
      ['Moth Light', 'linear-gradient(160deg,#6a4df0,#1a1230)'],
      ['Tin Roof', 'linear-gradient(160deg,#7a6a2f,#1f1a0a)']
    ];
    const posters = art.map((a, i) => {
      const f = i === 1;
      return {
        t: a[0], bg: a[1],
        lift: f ? 'transform:scale(1.06) translateY(-6px);z-index:2' : '',
        glow: f ? 'box-shadow:0 0 0 4px #f3ebe0,0 18px 48px rgba(217,138,28,.45)' : '',
        plate: f ? 'background:#d98a1c;color:#1a1208;padding:14px 16px' : ''
      };
    });
    return { nav, posters };
  }
}
</script>
</body>
</html>
