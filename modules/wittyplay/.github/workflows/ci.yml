# Generated by module-kit (scripts/module-kit.sh in WittyMediaServer). Run it again rather than editing this.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repository, and no secret is used.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # All of it, with tags: needs-bump below compares with the last tag.
          fetch-depth: 0
          fetch-tags: true
      # The newest patch release: every Go patch fixes security problems in the
      # standard library that programs ship with.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: false
      - name: The manifest
        run: go run github.com/wittywilla/wittymodule/cmd/wittymodule@v0.2.0 check .
      # Tags never move, so a change that keeps the last tag's version could never reach
      # anyone under its own number. Documentation doesn't count.
      - name: Changed since the last tag means a new version
        run: go run github.com/wittywilla/wittymodule/cmd/wittymodule@v0.2.0 needs-bump .
      - name: go.mod names released versions only
        run: |
          if grep -q '^replace' go.mod; then echo "go.mod has replace directives, which go install refuses"; exit 1; fi
          go mod tidy -diff
      - run: go vet ./...
      - run: go test ./... -count=1
      - name: Build every platform
        run: |
          for t in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 linux/arm linux/386 freebsd/amd64 freebsd/arm64; do
            echo "== $t"
            flags=""
            case $t in freebsd/*) flags="github.com/ebitengine/purego/internal/fakecgo=-std" ;; esac
            GOOS=${t%/*} GOARCH=${t#*/} GOARM=7 CGO_ENABLED=0 go build -gcflags="$flags" ./... || exit 1
          done
