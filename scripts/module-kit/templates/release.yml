# Generated by module-kit (scripts/module-kit.sh in WittyMediaServer). Run it again rather than editing this.
#
# A version tag publishes a release. Tags with a suffix such as -beta are prereleases.
name: release
on:
  push:
    tags: ["v*"]

# Every job asks for only what it needs: code from a dependency can run during a
# build, and must not find a token that can publish, or the signing key.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
#@if go signed
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: false
#@end
#@if node
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
#@end
      - name: The tag must match the version
        run: |
          want="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' @@VERSION_FILE@@ | head -1)"
          [ "v$want" = "$GITHUB_REF_NAME" ] || { echo "@@VERSION_FILE@@ says $want, and the tag is $GITHUB_REF_NAME"; exit 1; }
#@if go
      - name: Test
        run: |
          if grep -q '^replace' go.mod; then echo "go.mod has replace directives, which go install refuses"; exit 1; fi
          go vet ./...
          go test ./... -count=1
#@end
#@if npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test --if-present
#@end
#@if programs
      - name: Build every platform and write the checksum list
        run: go run @@TOOL@@ pack@@PACK_FLAGS@@ -out release .
#@end
#@if bundle
      - run: npm run build:bundle
      - name: Pack the bundle and write the checksum list
        run: go run @@TOOL@@ pack -web dist -out release .
#@end
#@if app
      - run: npm run build
      - name: Pack the built app
        run: |
          mkdir release
          name="@@ID@@-${GITHUB_REF_NAME#v}"
          (cd dist && zip -qr "../release/$name.zip" .)
          (cd release && sha256sum "$name.zip" > "$name-SHA256SUMS.txt")
#@end
#@if signed app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-files
          path: release/*
          if-no-files-found: error
#@end
#@if signed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sums
          path: release/*-SHA256SUMS.txt
          if-no-files-found: error

  # The signing key is used here, on a clean machine that holds nothing of this
  # repository: only the checksum list, and the signing tool at a released version.
  sign:
    needs: build
    runs-on: ubuntu-latest
    # Add yourself as a required reviewer of this environment to approve each
    # signature by hand.
    environment: release
    permissions: {}
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sums
          path: signed
      - name: Sign the checksum list
        env:
          SIGNING_KEY: ${{ secrets.WMS_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::The secret WMS_SIGNING_KEY is missing, and an unsigned release can't be installed. Nothing was published. Add it to the release environment, then run this again."
            exit 1
          fi
          key="$RUNNER_TEMP/module.key"
          trap 'rm -f "$key"' EXIT
          (umask 077; printf '%s\n' "$SIGNING_KEY" > "$key")
          go run @@TOOL_RELEASED@@ sign -key "$key" signed/*-SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signature
          path: signed/*.sig
          if-no-files-found: error
#@end

  # Publishing runs no project code at all.
  publish:
#@if signed
    needs: [build, sign]
#@end
#@if source app
    needs: build
#@end
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
#@if signed app
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-files
          path: release
#@end
#@if signed
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: signature
          path: release
#@end
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
#@if signed app
          files: release/*
          fail_on_unmatched_files: true
#@end
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
