# Generated by module-kit (scripts/module-kit.sh in WittyMediaServer). Run it again rather than editing this.
#
# Takes a version back: adds it to the signed list of withdrawn versions, on the
# release tagged "withdrawals". Run it from the Actions tab.
name: withdraw
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to take back, such as 1.2.3
        required: true
        type: string
      severity:
        description: broken warns and never installs it automatically; security refuses it and stops it where it is in use
        required: true
        type: choice
        default: broken
        options: [broken, security]
      reason:
        description: Why, in words people will read
        required: true
        type: string

permissions: {}

jobs:
  # Fetches the list there is now and hands it on, unread: only the job with the key
  # can tell whether to trust it.
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fetch the list and its signature, if there is one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          list="wittyink-withdrawn.json"
          mkdir list
          # Starting a new list when the old one couldn't be read would give it a
          # lower serial, which servers ignore, so only "no such release" means none yet.
          if assets="$(gh release view withdrawals --json assets --jq '.assets[].name' 2>err.txt)"; then
            if grep -Fxq "$list" <<<"$assets"; then gh release download withdrawals --pattern "$list" --dir list; fi
            if grep -Fxq "$list.sig" <<<"$assets"; then gh release download withdrawals --pattern "$list.sig" --dir list; fi
          elif ! grep -q 'release not found' err.txt; then
            cat err.txt
            exit 1
          fi
          # An artifact can't be empty.
          echo "What the withdraw workflow found." > list/found.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: list
          path: list/*
          if-no-files-found: error

  # The key is used here, on a clean machine that holds only the list and the tool. The
  # tool refuses a list already there unless it carries this key's signature, so
  # whoever can write to a release's files can't get their own list signed.
  sign:
    needs: fetch
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: list
          path: list
      - name: Add the version to the list and sign it
        env:
          SIGNING_KEY: ${{ secrets.WMS_SIGNING_KEY }}
          VERSION: ${{ inputs.version }}
          SEVERITY: ${{ inputs.severity }}
          REASON: ${{ inputs.reason }}
        run: |
          [[ "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::\"$VERSION\" is not a version such as 1.2.3"; exit 1; }
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::The secret WMS_SIGNING_KEY is missing, and a list without a signature is ignored. Nothing was published. Add it to the release environment, then run this again."
            exit 1
          fi
          key="$RUNNER_TEMP/module.key"
          trap 'rm -f "$key"' EXIT
          (umask 077; printf '%s\n' "$SIGNING_KEY" > "$key")
          rm -f list/found.txt
          list="list/wittyink-withdrawn.json"
          go run github.com/wittywilla/wittymodule/cmd/wittymodule@v0.2.0 withdraw -list "$list" -list-key "$key" -module wittyink -severity "$SEVERITY" -reason "$REASON" -- "$VERSION"
          go run github.com/wittywilla/wittymodule/cmd/wittymodule@v0.2.0 sign -key "$key" "$list"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed-list
          path: list/*
          if-no-files-found: error

  # Publishing runs no project code at all.
  publish:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: signed-list
          path: list
      - name: Put the list on the release tagged withdrawals
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A prerelease that is never "latest", so nothing treats it as a version.
          gh release view withdrawals >/dev/null 2>&1 ||
            gh release create withdrawals --prerelease --latest=false --title "Withdrawn versions" --notes "The signed list of versions that were taken back. Not a version."
          gh release upload withdrawals "list/wittyink-withdrawn.json" "list/wittyink-withdrawn.json.sig" --clobber
